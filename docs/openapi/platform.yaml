openapi: 3.0.3
info:
  title: DeliveryHub API
  version: v1
  description: See docs/api.md for the conventions (errors, pagination, authentication).
paths:
  /api/v1/app/config:
    get:
      operationId: app_config_retrieve
      description: Asked by the app on every start and return to the foreground; no
        account.
      summary: What the mobile app opens
      tags:
      - app
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      summary: Set the csrftoken cookie
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: POST {"phone", "password"} → the `me` payload of the API; 400 invalid_credentials.
      summary: Sign in with phone and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      summary: The signed-in member of our staff
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformMe'
          description: ''
  /api/v1/businesses:
    get:
      operationId: businesses_list
      summary: All businesses with today's numbers
      tags:
      - businesses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Businesses'
          description: ''
    post:
      operationId: businesses_create
      summary: 'Open a business: its schema, addresses and the owner''s admin account'
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCreated'
          description: ''
  /api/v1/businesses/{slug}:
    get:
      operationId: businesses_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetail'
          description: ''
    patch:
      operationId: businesses_partial_update
      summary: Edit the profile
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusinessProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetail'
          description: ''
    delete:
      operationId: businesses_destroy
      description: 'Drops its schema (staff, catalog, customers, orders), domains,
        bots and uploaded files. Errors: 409 business_active, 400 confirmation_required.'
      summary: Delete the business for good (only a suspended one; its slug typed
        as confirmation)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/businesses/{slug}/bots:
    post:
      operationId: businesses_bots_create
      summary: Connect a bot with a token from @BotFather
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotConnectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BotConnectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BotConnectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedBot'
          description: ''
  /api/v1/businesses/{slug}/bots/{role}:
    delete:
      operationId: businesses_bots_destroy
      summary: Disconnect a bot
      parameters:
      - in: path
        name: role
        schema:
          type: string
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/businesses/{slug}/bots/setup-link:
    post:
      operationId: businesses_bots_setup_link_create
      summary: A link to our platform bot that creates both bots in two taps
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSetupLink'
          description: ''
  /api/v1/businesses/{slug}/owner-password:
    post:
      operationId: businesses_owner_password_create
      summary: A new password for the owner (shown once)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credentials'
          description: ''
  /api/v1/businesses/{slug}/status:
    post:
      operationId: businesses_status_create
      summary: Suspend or activate (a suspended business answers 503 everywhere)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatusRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDetail'
          description: ''
  /api/v1/businesses/check-slug:
    get:
      operationId: businesses_check_slug_retrieve
      summary: Is this address free?
      parameters:
      - in: query
        name: slug
        schema:
          type: string
        required: true
      tags:
      - businesses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugCheck'
          description: ''
  /api/v1/geo/reverse:
    get:
      operationId: geo_reverse_retrieve
      description: 'Errors: 503 geocoder_unavailable (out of reach or switched off:
        the address is typed instead).'
      summary: The address at a point of the map
      parameters:
      - in: query
        name: lang
        schema:
          enum:
          - uz
          - ru
          type: string
          default: uz
          minLength: 1
        description: |-
          * `uz` - uz
          * `ru` - ru
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      tags:
      - geo
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocode'
          description: ''
  /api/v1/geo/search:
    get:
      operationId: geo_search_retrieve
      description: 'Errors: 503 geocoder_unavailable (out of reach or switched off:
        the address is typed instead).'
      summary: Places for a typed address (up to 5)
      parameters:
      - in: query
        name: lang
        schema:
          enum:
          - uz
          - ru
          type: string
          default: uz
          minLength: 1
        description: |-
          * `uz` - uz
          * `ru` - ru
      - in: query
        name: q
        schema:
          type: string
          minLength: 2
          maxLength: 200
        required: true
      tags:
      - geo
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSearch'
          description: ''
  /api/v1/landing:
    get:
      operationId: landing_retrieve
      summary: The live sample shop of our page for businesses
      tags:
      - landing
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landing'
          description: ''
    put:
      operationId: landing_update
      summary: 'Link another business as the sample (at once: the page asks when it
        opens)'
      tags:
      - landing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandingUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LandingUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LandingUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Landing'
          description: ''
  /api/v1/landing/config:
    get:
      operationId: landing_config_retrieve
      description: Asked by our page for businesses when it opens (through the bare
        domain); no account.
      summary: The live sample shop our page for businesses links to
      tags:
      - landing
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingConfig'
          description: ''
  /api/v1/leads:
    get:
      operationId: leads_list
      description: |-
        GET — our staff; POST — anyone (the landing page's form): no session, so no CSRF either, even when one of us
        sends the form while signed in.
      summary: Applications, newest first
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - contacted
          - lost
          - new
          - won
        description: Only these; all without it
      tags:
      - leads
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leads'
          description: ''
    post:
      operationId: leads_create
      description: |-
        GET — our staff; POST — anyone (the landing page's form): no session, so no CSRF either, even when one of us
        sends the form while signed in.
      summary: Leave an application (the landing page's form; no sign-in)
      tags:
      - leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeadCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadCreated'
          description: ''
  /api/v1/leads/{id}:
    patch:
      operationId: leads_partial_update
      summary: Change the status of an application or our note on it
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - leads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLeadUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLeadUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLeadUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
          description: ''
  /api/v1/mobile-app:
    get:
      operationId: mobile_app_retrieve
      summary: Which business the mobile app shows
      tags:
      - mobile-app
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileApp'
          description: ''
    put:
      operationId: mobile_app_update
      summary: 'Show another business in the mobile app (at once: the app asks on
        every start)'
      tags:
      - mobile-app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAppUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MobileAppUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MobileAppUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileApp'
          description: ''
components:
  schemas:
    AppConfig:
      type: object
      properties:
        shop:
          allOf:
          - $ref: '#/components/schemas/AppShop'
          nullable: true
          description: 'null: no business chosen, or it is suspended'
        min_version:
          type: string
          description: An older app asks to be updated from the store
        store:
          $ref: '#/components/schemas/AppStore'
      required:
      - min_version
      - shop
      - store
    AppShop:
      type: object
      description: |-
        The shop the mobile app opens. Needs `request` in the context: the app is not on our host, so every address
        is absolute.
      properties:
        slug:
          type: string
        name:
          type: string
        tagline:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        brand_color:
          type: string
          description: '"#rrggbb" or "" (the app then uses its own colour)'
        url:
          type: string
          format: uri
          description: The shop the app shows
      required:
      - brand_color
      - logo
      - name
      - slug
      - tagline
      - url
    AppStore:
      type: object
      properties:
        android:
          type: string
          format: uri
          nullable: true
        ios:
          type: string
          format: uri
          nullable: true
      required:
      - android
      - ios
    BlankEnum:
      enum:
      - ''
    Bot:
      type: object
      properties:
        username:
          type: string
        alive:
          type: boolean
          description: The bot service polls it right now
        created_via:
          $ref: '#/components/schemas/CreatedViaEnum'
      required:
      - alive
      - created_via
      - username
    BotConnectRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        token:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - role
      - token
    BotSetupLink:
      type: object
      properties:
        url:
          type: string
          format: uri
        qr_svg:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - qr_svg
      - url
    Bots:
      type: object
      properties:
        client:
          allOf:
          - $ref: '#/components/schemas/Bot'
          nullable: true
        admin:
          allOf:
          - $ref: '#/components/schemas/Bot'
          nullable: true
      required:
      - admin
      - client
    BusinessCard:
      type: object
      description: 'Needs `request` in the context (addresses follow the style of
        the request: public or *.localhost).'
      properties:
        slug:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/BusinessStatusEnum'
        logo:
          type: string
          nullable: true
        brand_color:
          type: string
        tagline:
          type: string
        created_at:
          type: string
          format: date-time
        links:
          $ref: '#/components/schemas/Links'
        stats:
          $ref: '#/components/schemas/Stats'
        bots:
          $ref: '#/components/schemas/Bots'
      required:
      - bots
      - brand_color
      - created_at
      - links
      - logo
      - name
      - slug
      - stats
      - status
      - tagline
    BusinessCreateRequest:
      type: object
      description: |-
        Editable profile; `logo: null` (or empty) removes the logo. The point on the map comes as both `lat` and
        `lng`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        tagline:
          type: string
          maxLength: 200
        support_phone:
          type: string
          maxLength: 30
        address:
          type: string
          minLength: 1
          maxLength: 255
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
        delivery_time:
          type: string
          maxLength: 20
        min_order:
          type: integer
          maximum: 100000000
          minimum: 0
        brand_color:
          type: string
          maxLength: 7
        logo:
          type: string
          format: binary
          nullable: true
        slug:
          type: string
          minLength: 1
          description: '3–30 characters: a-z, 0-9, "-"'
          maxLength: 40
        owner_name:
          type: string
          minLength: 1
          maxLength: 120
        owner_phone:
          type: string
          minLength: 1
          maxLength: 30
        owner_password:
          description: Empty → generated
          oneOf:
          - type: string
            maxLength: 128
            minLength: 8
          - type: string
            maxLength: 0
      required:
      - address
      - lat
      - lng
      - name
      - owner_name
      - owner_phone
      - slug
    BusinessCreated:
      type: object
      properties:
        business:
          $ref: '#/components/schemas/BusinessDetail'
        credentials:
          $ref: '#/components/schemas/Credentials'
      required:
      - business
      - credentials
    BusinessDetail:
      type: object
      description: 'Needs `request` in the context (addresses follow the style of
        the request: public or *.localhost).'
      properties:
        slug:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/BusinessStatusEnum'
        logo:
          type: string
          nullable: true
        brand_color:
          type: string
        tagline:
          type: string
        created_at:
          type: string
          format: date-time
        links:
          $ref: '#/components/schemas/Links'
        stats:
          $ref: '#/components/schemas/Stats'
        bots:
          $ref: '#/components/schemas/Bots'
        support_phone:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        working_hours:
          allOf:
          - $ref: '#/components/schemas/WorkingHours'
          description: Set by the business in its admin panel (read-only here)
        delivery_time:
          type: string
        min_order:
          type: integer
        owner:
          allOf:
          - $ref: '#/components/schemas/Owner'
          nullable: true
        platform_bot:
          allOf:
          - $ref: '#/components/schemas/PlatformBot'
          nullable: true
        missing_roles:
          type: array
          items:
            $ref: '#/components/schemas/MissingRolesEnum'
      required:
      - address
      - bots
      - brand_color
      - created_at
      - delivery_time
      - lat
      - links
      - lng
      - logo
      - min_order
      - missing_roles
      - name
      - owner
      - platform_bot
      - slug
      - stats
      - status
      - support_phone
      - tagline
      - working_hours
    BusinessStatusEnum:
      enum:
      - active
      - suspended
      type: string
      description: |-
        * `active` - active
        * `suspended` - suspended
    BusinessTotals:
      type: object
      properties:
        businesses:
          type: integer
        active:
          type: integer
        orders_today:
          type: integer
        revenue_today:
          type: integer
      required:
      - active
      - businesses
      - orders_today
      - revenue_today
    Businesses:
      type: object
      properties:
        domain:
          type: string
          description: 'PLATFORM_DOMAIN: businesses live at <slug>.<domain>'
        totals:
          $ref: '#/components/schemas/BusinessTotals'
        results:
          type: array
          items:
            $ref: '#/components/schemas/BusinessCard'
      required:
      - domain
      - results
      - totals
    ConnectedBot:
      type: object
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
      required:
      - bot
    CreatedViaEnum:
      enum:
      - managed
      - token
      type: string
      description: |-
        * `managed` - managed
        * `token` - token
    Credentials:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
      required:
      - password
      - phone
    ErrorEnum:
      enum:
      - slug_invalid
      - slug_reserved
      - slug_taken
      type: string
      description: |-
        * `slug_invalid` - slug_invalid
        * `slug_reserved` - slug_reserved
        * `slug_taken` - slug_taken
    GeoSearch:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Place'
      required:
      - results
    KindEnum:
      enum:
      - cafe
      - fastfood
      - shop
      - other
      type: string
      description: "* `` - \n* `cafe` - cafe\n* `fastfood` - fastfood\n* `shop` -
        shop\n* `other` - other"
    Landing:
      type: object
      properties:
        sample:
          allOf:
          - $ref: '#/components/schemas/BusinessCard'
          nullable: true
          description: Chosen in our panel
        updated_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: 'The page itself: https://<domain>/'
        config:
          allOf:
          - $ref: '#/components/schemas/LandingConfig'
          description: Exactly what the page receives now
      required:
      - config
      - sample
      - updated_at
      - url
    LandingConfig:
