openapi: 3.0.3
info:
  title: DeliveryHub API
  version: v1
  description: See docs/api.md for the conventions (errors, pagination, authentication).
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      summary: Set the csrftoken cookie
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: POST {"phone", "password"} → the `me` payload of the API; 400 invalid_credentials.
      summary: Sign in with phone and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: The signed-in staff member and their business
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
  /api/v1/auth/telegram:
    post:
      operationId: auth_telegram_create
      description: |-
        Sign-in of the admin panel opened as a Mini App from the staff bot: Telegram signs initData with the
        bot token, and a staff member whose Telegram account is linked is signed in without a password.
      summary: Sign in from the staff bot Mini App
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitDataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitDataRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitDataRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
  /api/v1/branches:
    get:
      operationId: branches_list
      description: 'Errors: 403 branches_disabled (our panel has not allowed branches).'
      summary: 'Branches (head office: all; branch staff: their own)'
      tags:
      - branches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
    post:
      operationId: branches_create
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: Open a branch (admin role)
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BranchWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/branches/{id}:
    get:
      operationId: branches_retrieve
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - branches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    patch:
      operationId: branches_partial_update
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: 'Edit a branch, or stop (is_active: false) and resume it (admin role)'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBranchWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBranchWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    delete:
      operationId: branches_destroy
      description: 'Errors: 409 branch_in_use — stop it instead (is_active: false).'
      summary: Delete a branch that has no orders and no staff (admin role)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - branches
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/business:
    get:
      operationId: business_retrieve
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: Working hours and whether the business is open now
      tags:
      - business
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingHours'
          description: ''
    patch:
      operationId: business_partial_update
      description: '`week`: seven shifts, Monday first, null for a day off; `null`
        — open at any time.'
      summary: Set the working hours (admin role)
      tags:
      - business
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWeekUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWeekUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWeekUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingHours'
          description: ''
  /api/v1/categories:
    get:
      operationId: categories_list
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      summary: All categories (not paginated)
      parameters:
      - in: query
        name: search
        schema:
          type: string
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: categories_create
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{id}:
    get:
      operationId: categories_retrieve
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      summary: Delete a category (its products stay, without a category)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/clients:
    get:
      operationId: clients_list
      description: A paginated list for staff; subclasses filter in get_queryset().
      summary: Customers, newest first (head office)
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
  /api/v1/clients/{id}:
    get:
      operationId: clients_retrieve
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: A customer with their orders
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
          description: ''
    patch:
      operationId: clients_partial_update
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: Edit a customer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
          description: ''
  /api/v1/dashboard:
    get:
      operationId: dashboard_retrieve
      description: Branch staff get the numbers of their branch.
      summary: Key numbers of the business
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/geo/reverse:
    get:
      operationId: geo_reverse_retrieve
      description: 'Errors: 503 geocoder_unavailable (out of reach or switched off:
        the address is typed instead).'
      summary: The address at a point of the map
      parameters:
      - in: query
        name: lang
        schema:
          enum:
          - uz
          - ru
          type: string
          default: uz
          minLength: 1
        description: |-
          * `uz` - uz
          * `ru` - ru
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      tags:
      - geo
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocode'
          description: ''
  /api/v1/geo/search:
    get:
      operationId: geo_search_retrieve
      description: 'Errors: 503 geocoder_unavailable (out of reach or switched off:
        the address is typed instead).'
      summary: Places for a typed address (up to 5)
      parameters:
      - in: query
        name: lang
        schema:
          enum:
          - uz
          - ru
          type: string
          default: uz
          minLength: 1
        description: |-
          * `uz` - uz
          * `ru` - ru
      - in: query
        name: q
        schema:
          type: string
          minLength: 2
          maxLength: 200
        required: true
      tags:
      - geo
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSearch'
          description: ''
  /api/v1/orders:
    get:
      operationId: orders_list
      description: A paginated list for staff; subclasses filter in get_queryset().
      summary: Orders, newest first
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: 'Head office: a branch id, or `none` for orders without a branch'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
        description: Order number, customer name or phone
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderSummaryList'
          description: ''
  /api/v1/orders/{id}:
    get:
      operationId: orders_retrieve
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: One order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
    patch:
      operationId: orders_partial_update
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: Change the status (the customer gets a Telegram message)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{id}/branch:
    put:
      operationId: orders_branch_update
      description: 'Also moves it to another branch. Errors: 400 branches_disabled,
        400 validation (branch_id: does_not_exist, inactive), 403 for branch staff.'
      summary: Send the order to a branch (head office; the staff bot tells the branch)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderBranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderBranchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderBranchRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/products:
    get:
      operationId: products_list
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: frozen
        schema:
          type: boolean
        description: 'true: only frozen, false: only on sale'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      summary: Add a product
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: frozen
        schema:
          type: boolean
        description: 'true: only frozen, false: only on sale'
      - in: query
        name: search
        schema:
          type: string
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{id}:
    get:
      operationId: products_retrieve
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      summary: Edit a product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: products_destroy
      description: |-
        Every staff member reads; only the head office changes (the menu is one for every branch: a branch hiding a
        dish would hide it everywhere).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/sales:
    get:
      operationId: sales_retrieve
      description: Branch staff see the sales and numbers of their branch.
      summary: Everything the point of sale needs
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sales'
          description: ''
    post:
      operationId: sales_create
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: Record a sale
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleCreated'
          description: ''
  /api/v1/telegram:
    get:
      operationId: telegram_retrieve
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: The staff bot and linked Telegram accounts
      tags:
      - telegram
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Telegram'
          description: ''
  /api/v1/telegram/invites:
    post:
      operationId: telegram_invites_create
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: A one-time link that connects a Telegram account (yours; admins — anyone's)
      tags:
      - telegram
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/v1/telegram/links/{id}:
    patch:
      operationId: telegram_links_partial_update
      description: An endpoint for any signed-in staff member of the business (admin,
        manager or branch staff).
      summary: Turn order notifications on or off
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - telegram
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLinkUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLinkUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLinkUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
