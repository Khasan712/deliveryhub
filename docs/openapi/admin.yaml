openapi: 3.0.3
info:
  title: DeliveryHub API
  version: v1
  description: See docs/api.md for the conventions (errors, pagination, authentication).
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      summary: Set the csrftoken cookie
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: POST {"phone", "password"} → the `me` payload of the API; 400 invalid_credentials.
      summary: Sign in with phone and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: The signed-in staff member and their business
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
  /api/v1/auth/telegram:
    post:
      operationId: auth_telegram_create
      description: |-
        Sign-in of the admin panel opened as a Mini App from the staff bot: Telegram signs initData with the
        bot token, and a staff member whose Telegram account is linked is signed in without a password.
      summary: Sign in from the staff bot Mini App
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitDataRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitDataRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitDataRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMe'
          description: ''
  /api/v1/business:
    get:
      operationId: business_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Working hours and whether the business is open now
      tags:
      - business
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingHours'
          description: ''
    patch:
      operationId: business_partial_update
      description: '`week`: seven shifts, Monday first, null for a day off; `null`
        — open at any time.'
      summary: Set the working hours (admin role)
      tags:
      - business
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWeekUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWeekUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWeekUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingHours'
          description: ''
  /api/v1/categories:
    get:
      operationId: categories_list
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: All categories (not paginated)
      parameters:
      - in: query
        name: search
        schema:
          type: string
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: categories_create
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/categories/{id}:
    get:
      operationId: categories_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Delete a category (its products stay, without a category)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/clients:
    get:
      operationId: clients_list
      description: A paginated list for staff; subclasses filter in get_queryset().
      summary: Customers, newest first
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
  /api/v1/clients/{id}:
    get:
      operationId: clients_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: A customer with their orders
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
          description: ''
    patch:
      operationId: clients_partial_update
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Edit a customer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClientUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClientUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClientUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetail'
          description: ''
  /api/v1/dashboard:
    get:
      operationId: dashboard_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Key numbers of the business
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/v1/orders:
    get:
      operationId: orders_list
      description: A paginated list for staff; subclasses filter in get_queryset().
      summary: Orders, newest first
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
        description: Order number, customer name or phone
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderSummaryList'
          description: ''
  /api/v1/orders/{id}:
    get:
      operationId: orders_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: One order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
    patch:
      operationId: orders_partial_update
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Change the status (the customer gets a Telegram message)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderStatusRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/products:
    get:
      operationId: products_list
      description: A paginated list for staff; subclasses filter in get_queryset().
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: frozen
        schema:
          type: boolean
        description: 'true: only frozen, false: only on sale'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      description: A paginated list for staff; subclasses filter in get_queryset().
      summary: Add a product
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: frozen
        schema:
          type: boolean
        description: 'true: only frozen, false: only on sale'
      - in: query
        name: search
        schema:
          type: string
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/products/{id}:
    get:
      operationId: products_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Edit a product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: products_destroy
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/sales:
    get:
      operationId: sales_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Everything the point of sale needs
      tags:
      - sales
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sales'
          description: ''
    post:
      operationId: sales_create
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Record a sale
      tags:
      - sales
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleCreated'
          description: ''
  /api/v1/telegram:
    get:
      operationId: telegram_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: The staff bot and linked Telegram accounts
      tags:
      - telegram
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Telegram'
          description: ''
  /api/v1/telegram/invites:
    post:
      operationId: telegram_invites_create
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: A one-time link that connects a Telegram account (yours; admins — anyone's)
      tags:
      - telegram
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/v1/telegram/links/{id}:
    patch:
      operationId: telegram_links_partial_update
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Turn order notifications on or off
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - telegram
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLinkUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLinkUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLinkUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
          description: ''
    delete:
      operationId: telegram_links_destroy
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Unlink a Telegram account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - telegram
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/units:
    get:
      operationId: units_list
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Units of measure
      tags:
      - units
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
          description: ''
    post:
      operationId: units_create
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      tags:
      - units
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnitRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
          description: ''
  /api/v1/users:
    get:
      operationId: users_list
      description: A paginated list for staff; subclasses filter in get_queryset().
      summary: Staff users (admins only)
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffUserList'
          description: ''
    post:
      operationId: users_create
      description: A paginated list for staff; subclasses filter in get_queryset().
      summary: Add a staff user
      parameters:
      - in: query
        name: search
        schema:
          type: string
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffUserRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
  /api/v1/users/{id}:
    get:
      operationId: users_retrieve
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
    patch:
      operationId: users_partial_update
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaffUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaffUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
          description: ''
    delete:
      operationId: users_destroy
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/voice/parse:
    post:
      operationId: voice_parse_create
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: Recorded clip or text → the complete updated order form
      tags:
      - voice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceStateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceStateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoiceStateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceParse'
          description: ''
  /api/v1/voice/token:
    post:
      operationId: voice_token_create
      description: An endpoint for any signed-in staff member of the business (admin
        or manager).
      summary: A single-use Gemini Live session for live captions
      tags:
      - voice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSession'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name_uz:
          type: string
          maxLength: 100
        name_ru:
          type: string
          maxLength: 100
        products_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - id
      - name_ru
      - name_uz
      - products_count
    CategoryRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name_uz:
          type: string
          maxLength: 100
        name_ru:
          type: string
