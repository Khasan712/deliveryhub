components:
  schemas:
    Branch:
      type: object
      description: |-
        `staff_count` comes annotated and `active_staff` prefetched; `today` from the context ({branch id: {orders,
        revenue}}).
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        phone:
          type: string
        is_active:
          type: boolean
          description: An inactive branch gets no new orders and is not offered to
            customers
        created_at:
          type: string
          format: date-time
        staff_count:
          type: integer
          description: Active staff users of the branch
        staff:
          type: array
          items:
            $ref: '#/components/schemas/BranchStaff'
          description: Its active staff users, by first name
        today:
          allOf:
          - $ref: '#/components/schemas/BranchToday'
          description: Today's orders of the branch (rejected ones not counted) and
            money
      required:
      - address
      - created_at
      - id
      - is_active
      - lat
      - lng
      - name
      - phone
      - staff
      - staff_count
      - today
    BranchOption:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
          nullable: true
        lng:
          type: number
          format: double
          nullable: true
        distance_km:
          type: number
          format: double
          nullable: true
          description: As the crow flies; null without a point
        nearest:
          type: boolean
      required:
      - address
      - distance_km
      - id
      - lat
      - lng
      - name
      - nearest
    BranchRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    BranchRefRequest:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
      required:
      - id
      - name
    BranchStaff:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string
      required:
      - id
      - name
      - phone_number
    BranchToday:
      type: object
      properties:
        orders:
          type: integer
        revenue:
          type: integer
      required:
      - orders
      - revenue
    BranchWriteRequest:
      type: object
      description: 'Create / update. The point on the map comes as both `lat` and
        `lng`: it is how the nearest branch is found.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 255
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lng:
          type: number
          format: double
          maximum: 180
          minimum: -180
        phone:
          type: string
          maxLength: 30
        is_active:
          type: boolean
      required:
      - address
      - lat
      - lng
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name_uz:
          type: string
          maxLength: 100
        name_ru:
          type: string
          maxLength: 100
        products_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - id
      - name_ru
      - name_uz
      - products_count
    CategoryRef:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name_uz:
          type: string
          maxLength: 100
        name_ru:
          type: string
          maxLength: 100
      required:
      - id
      - name_ru
      - name_uz
    CategoryRequest:
      type: object
      properties:
        name_uz:
          type: string
          minLength: 1
          maxLength: 100
        name_ru:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name_ru
      - name_uz
    Client:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        tg_nick:
          type: string
        telegram:
          type: boolean
        lang:
          type: string
        orders_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - first_name
      - id
      - lang
      - last_name
      - orders_count
      - phone
      - telegram
      - tg_nick
    ClientDetail:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        tg_nick:
          type: string
        telegram:
          type: boolean
        lang:
          type: string
        orders_count:
          type: integer
        created_at:
          type: string
          format: date-time
        location:
          type: string
        orders:
          type: array
