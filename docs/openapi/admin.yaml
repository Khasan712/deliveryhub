          $ref: '#/components/schemas/DashboardClients'
        products:
          $ref: '#/components/schemas/DashboardProducts'
        categories:
          $ref: '#/components/schemas/DashboardCategories'
        by_status:
          type: array
          items:
            $ref: '#/components/schemas/StatusCount'
        daily:
          type: array
