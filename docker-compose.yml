# DeliveryHub: every part in its own container (docs/architecture.md). Settings: .env (see .env.example).
#   docker compose up -d --build      → http://hub.localhost:8100 (our panel), http://<slug>.localhost:8100 (shops),
#                                       http://<slug>-admin.localhost:8100 (admin panels)
# Production: the web container serves plain HTTP on WEB_PORT; TLS ends at the edge in front (docs/deploy.md).
# A second, throwaway stack (make e2e): STACK_NAME / ENV_FILE / ports from its own --env-file, own project name.
name: deliveryhub

x-backend-env: &backend-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    container_name: ${STACK_NAME:-deliveryhub}_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deliveryhub}
      POSTGRES_USER: ${POSTGRES_USER:-deliveryhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # SSD storage: reading by index costs almost what reading in order does, so the planner should not fall back
    # to scanning whole tables (the default 4.0 assumes spinning disks).
    command: ["postgres", "-c", "random_page_cost=1.1"]
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5440}:5432"  # for local tools only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME:-deliveryhub}_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # cache only

  # The API of all three UIs; applies the migrations of every business on start.
  backend:
    build: ./backend
    container_name: ${STACK_NAME:-deliveryhub}_backend
    restart: always
    env_file: ${ENV_FILE:-.env}
    environment: *backend-env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Every Telegram bot: customers' and staff bots of all businesses + our platform bot. Reads and writes the
  # database directly (no HTTP hop to the backend).
  bot:
    build: ./bot
    container_name: ${STACK_NAME:-deliveryhub}_bot
    restart: always
    env_file: ${ENV_FILE:-.env}
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy  # the schema is migrated

  client-ui:
    build: ./client-ui
    container_name: ${STACK_NAME:-deliveryhub}_client_ui
    restart: always

  admin-ui:
    build: ./admin-ui
    container_name: ${STACK_NAME:-deliveryhub}_admin_ui
    restart: always

  deliveryhub-ui:
    build: ./deliveryhub-ui
    container_name: ${STACK_NAME:-deliveryhub}_hub_ui
    restart: always

  landing:
    build: ./landing
    container_name: ${STACK_NAME:-deliveryhub}_landing
    restart: always

  web:
    image: caddy:2.11-alpine
    container_name: ${STACK_NAME:-deliveryhub}_web
    restart: always
    environment:
      PLATFORM_HUB_SUBDOMAIN: ${PLATFORM_HUB_SUBDOMAIN:-deliveryhub}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
    ports:
      # Only the edge proxy / tunnel on this host talks to it (WEB_BIND=0.0.0.0 opens it to the network).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8100}:80"
    depends_on:
      - backend
      - client-ui
      - admin-ui
      - deliveryhub-ui
      - landing

volumes:
  db:
  media:
